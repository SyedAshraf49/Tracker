services:
  - type: web
    name: chennai-early-career-tracker
    runtime: static
    plan: free
    buildCommand: pip install -r requirements.txt && ./render-build.sh
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /dashboard_data.js
        name: Cache-Control
        value: no-store
